model:
  # paths
  qwen_path: "../Qwen3.5-9B/models--Qwen--Qwen3.5-9B/snapshots/c202236235762e1c871ad0ccb60c8ee5ba337b9a/"
  wav2vec2_path: "../wav2vec2-xls-r-300m/"
  ckpt: "" # "outputs/asv19_no_reasoning/checkpoint_best.pth" # if not "", load model from ckpt for training or evaluation
  freeze_wav2vec2: False
  speech_qwen_proj_model: ""
  freeze_speech_qwen_proj: False

  # LoRA
  lora: True
  lora_rank: 8
  lora_alpha: 32
  lora_dropout: 0.1

  multi_prompt: True
  prompt_template: "{}"
  prompt_path: "prompts/train_prompt.json"
  test_prompt_path: "prompts/test_prompt.json"
  max_txt_len: 300
  end_sym: ""

datasets:
  train_ann_path: "data/asv_mlaad_400_train.json"
  valid_ann_path: "data/asv_mlaad_400_val.json"
  test_ann_path: "data/asv_mlaad_400_test.json"

  whisper_path: "openai/whisper-large-v2"
  wav2vec2_path: "facebook/wav2vec2-xls-r-300m"

run:
  # log & settings
  seed: 42
  output_dir: "outputs"
  evaluate: False # if True, only evaluate model on test data

  log_freq: 5
  epoch_based: False
  iters_per_epoch: 5000
  accum_grad_iters: 4
  batch_size_train: 4
  batch_size_eval: 8
  num_workers: 1

  device: "cuda"
  use_distributed: True
  amp: True
  world_size: 1
  dist_url: "env://"

  # optimizer & scheduler
  optims:
    max_epoch: 30
    warmup_steps: 3000
    warmup_start_lr: 1e-6
    init_lr: 3e-5
    min_lr: 1e-5
    weight_decay: 0.05
    beta2: 0.999