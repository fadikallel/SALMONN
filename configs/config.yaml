model:
  # paths
  llama_path: "../vicuna-13b-v1.1/models--lmsys--vicuna-13b-v1.1/snapshots/1acf26f93742fafe91562253ec0e5d94e40a8bea/"
  whisper_path: "../whisper-large-v2/models--openai--whisper-large-v2/snapshots/ae4642769ce2ad8fc292556ccea8e901f1530655/"
  beats_path: "../BEATs_iter3_plus_AS2M_finetuned_on_AS2M_cpt2.pt"

  ckpt: "../salmonn_v1.pth" # if not "", load model from ckpt for training or evaluation

  freeze_whisper: True
  freeze_beats: True

  # window-level Q-Former
  use_speech_Qformer: True
  freeze_speech_QFormer: False
  window_level_Qformer: True
  num_speech_query_token: 1
  second_per_window: 0.333333
  second_stride: 0.333333

  speech_llama_proj_model: ""
  freeze_speech_llama_proj: False

  # LoRA
  lora: True
  lora_rank: 8
  lora_alpha: 32
  lora_dropout: 0.1

  multi_prompt: True
  prompt_template: "USER: {}\nASSISTANT:"
  prompt_path: "prompts/train_prompt.json"
  test_prompt_path: "prompts/test_prompt.json"
  max_txt_len: 4
  end_sym: "</s>"


datasets:
  train_ann_path: "/netscratch/fkallel/dfd_llm/datasets/asvspoof19_train.json"
  valid_ann_path: "/netscratch/fkallel/dfd_llm/datasets/asvspoof19_dev.json"
  test_ann_path: "/netscratch/fkallel/dfd_llm/datasets/asvspoof19_eval.json"

  whisper_path: "openai/whisper-large-v2"

run:
  # log & settings
  seed: 42
  output_dir: "outputs"
  evaluate: False # if True, only evaluate model on test data

  log_freq: 5
  epoch_based: False
  iters_per_epoch: 6000
  accum_grad_iters: 1
  batch_size_train: 4
  batch_size_eval: 8
  num_workers: 8

  device: "cuda"
  use_distributed: True
  amp: True
  amp_dtype: "bfloat16"
  world_size: 1
  dist_url: "env://"

  # optimizer & scheduler
  optims:
    max_epoch: 30
    warmup_steps: 10000  # Very long warmup
    warmup_start_lr: 1e-8
    init_lr: 1e-5  # Reduced from 3e-5
    min_lr: 1e-7
    weight_decay: 0.05
    beta2: 0.999