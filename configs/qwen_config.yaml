model:
  # paths
  qwen_path: "../Qwen3.5-9B/models--Qwen--Qwen3.5-9B/snapshots/c202236235762e1c871ad0ccb60c8ee5ba337b9a/"
  whisper_path: "../whisper-large-v2/models--openai--whisper-large-v2/snapshots/ae4642769ce2ad8fc292556ccea8e901f1530655/"
  wav2vec2_path: "../wav2vec2-xls-r-300m/"

  ckpt: "" # if not "", load model from ckpt for training or evaluation

  freeze_whisper: True
  freeze_wav2vec2: True

  speech_qwen_proj_model: ""
  freeze_speech_qwen_proj: False

  # LoRA
  lora: True
  lora_rank: 16
  lora_alpha: 64
  lora_dropout: 0.1

  multi_prompt: True
  prompt_template: "{}"
  prompt_path: "prompts/train_prompt.json"
  test_prompt_path: "prompts/test_prompt.json"
  max_txt_len: 300
  end_sym: ""

datasets:
  train_ann_path: "/ds-slt/audio/fkallel/LibriSpeech/train-clean-100.json"
  valid_ann_path: "/ds-slt/audio/fkallel/LibriSpeech/dev-clean.json"
  test_ann_path: "/ds-slt/audio/fkallel/LibriSpeech/test-clean.json"

  wav2vec2_path: "facebook/wav2vec2-xls-r-300m"

run:
  # log & settings
  seed: 42
  output_dir: "outputs"
  evaluate: False # if True, only evaluate model on test data

  log_freq: 5
  epoch_based: True
  # iters_per_epoch: 3000
  accum_grad_iters: 1
  batch_size_train: 1
  batch_size_eval: 1
  num_workers: 1

  device: "cuda"
  use_distributed: True
  amp: True
  world_size: 1
  dist_url: "env://"

  # optimizer & scheduler
  optims:
  optims:
    max_epoch: 5
    warmup_steps: 0  # Very long warmup
    warmup_start_lr: 1e-6
    init_lr: 1e-6  # Reduced from 3e-5
    min_lr: 1e-6
    weight_decay: 0.05
    beta2: 0.999